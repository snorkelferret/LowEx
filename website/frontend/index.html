<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Expectations - Splash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center overflow-hidden m-0 p-0">

    <!-- Shared parent container keeps both images in identical DOM layout/scale -->
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 p-0 position-relative">
        
        <!-- Visible RGB Artwork -->
        <img id="main-img" 
             src="./images/main.png" 
             alt="Splash Artwork" 
             class="img-fluid user-select-none pe-auto mh-100 mw-100">

        <!-- Mask Image (In the same container for exact scale/alignment, hidden from view) -->
        <img id="mask-img" 
             src="./images/mainAlpha.png" 
             alt="" 
             style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;">
    </div>

    <script>
        const mainImg = document.getElementById('main-img');
        const maskImg = document.getElementById('mask-img');
        
        // Offscreen canvas for hit testing
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // Target updated to shopfront.html per spec
        const TARGET_URL = 'shopfront.html';
        const MASK_THRESHOLD = 128; // Active pixel brightness threshold

        // Sync canvas size and bake mask when maskImg loads
        maskImg.addEventListener('load', () => {
            canvas.width = maskImg.naturalWidth;
            canvas.height = maskImg.naturalHeight;
            ctx.drawImage(maskImg, 0, 0);
        });

        // Sample RGB pixel value from mask canvas at cursor position
        function getMaskPixel(e) {
            if (!canvas.width) return 0;

            const rect = mainImg.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return 0;

            // Reads red channel of the RGB mask image
            return ctx.getImageData(x, y, 1, 1).data[0];
        }

        // Mouse hover cursor toggle
        mainImg.addEventListener('mousemove', (e) => {
            const val = getMaskPixel(e);
            mainImg.style.cursor = (val > MASK_THRESHOLD) ? 'pointer' : 'default';
        });

        // Click handler
        mainImg.addEventListener('click', (e) => {
            if (getMaskPixel(e) > MASK_THRESHOLD) {
                window.location.href = TARGET_URL;
            }
        });
    </script>

    <!-- Bootstrap 5 JS Bundle, added for the report dialog below. The splash
         needed no JavaScript library before this. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Report-a-problem button.

         Included because this is a page like any other, and if the splash is
         broken — the artwork missing, or the click region not where it looks —
         the person stuck on it has nowhere else to go. It is the one page with
         no navigation at all. -->
    <script type="module" src="./src/feedback.js"></script>
</body>
</html>
