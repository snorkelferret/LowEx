<!-- Module: frontend/src/components/devInvites.html -->
<!-- The id is the target of the Invites tab. -->
<section id="dev-invites-module">
  <!-- Invitation Form Card -->
  <div class="card superuser-module mb-4">
    <div class="card-header">
      <h2 class="h5 mb-0">
        <i class="bi bi-person-plus-fill text-primary me-2"></i>Invite
      </h2>
    </div>

    <div class="card-body">
      <div id="invite-alert" class="alert py-2 px-3 small mb-3 d-none" role="alert"></div>

      <form id="inviteDevForm">
        <div class="row g-3">
          <!-- The invitee's address. Not "Developer" — the role dropdown
               beside this field offers Tester as well. -->
          <div class="col-md-6">
            <label for="invite-email" class="form-label small text-secondary fw-semibold">Email address</label>
            <input type="email" id="invite-email" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="person@somewhere.com" required>
          </div>

          <!-- Role Selection -->
          <div class="col-md-4">
            <!-- ✅ FIX: Added for="invite-role" to link with the select menu element -->
            <label for="invite-role" class="form-label small text-secondary fw-semibold">Role / Access Level</label>
            <!-- Repopulated on load from /assignable-roles with only what THIS
                 caller may assign: an inviter may assign roles strictly below
                 their own, so an admin is never offered Superuser. These
                 options are just a fallback if that request fails. -->
            <select id="invite-role" class="form-select form-select-sm bg-dark text-light border-secondary">
              <option value="developer" selected>Developer</option>
              <option value="user">Tester</option>
            </select>
          </div>

          <!-- Submit Button -->
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" id="btn-send-invite" class="btn btn-primary btn-sm w-100 fw-semibold">
              <i class="bi bi-send me-1"></i> Send Invite
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Active & Pending Invitations Table -->
  <div class="card superuser-module mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="h5 mb-0">Active &amp; Pending Invitations</h2>
      <!-- Filled from the settings endpoint by sharedInvites.js. It was a
           hardcoded "28 Days" while the server issued invitations from a
           constant of its own, so the number on screen and the number in force
           were two copies that agreed by luck. An administrator can change the
           window now, and this has to follow it. -->
      <span class="small text-secondary">
        Default Expiration: <strong id="inviteValidity">&mdash;</strong>
      </span>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle small mb-0">
        <thead class="text-uppercase">
          <tr>
            <th>Email address</th>
            <th>Role</th>
            <th>Status</th>
            <th>Expires</th>
            <th>Reissues</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="invite-list-body">
          <!-- Dynamic rows injected by JavaScript -->
          <tr>
            <td colspan="6" class="text-center text-muted py-3">Loading invitations...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
