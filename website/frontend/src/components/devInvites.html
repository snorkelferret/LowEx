<!-- Module: frontend/src/components/developerInvites.html -->
<!-- The id is the anchor target for the Invites entry in the admin menu. -->
<section class="container my-4" id="dev-invites-module">
  <!-- Invite Developer Form Card -->
  <div class="card bg-dark text-light border-secondary shadow-sm mb-4">
    <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-3">
      <h5 class="card-title mb-0 fw-bold">
        <i class="bi bi-person-plus-fill text-primary me-2"></i>Invite Developer
      </h5>
      <span class="badge bg-secondary opacity-75">Admin Tools</span>
    </div>

    <div class="card-body p-4">
      <div id="invite-alert" class="alert d-none py-2 px-3 small mb-3" role="alert"></div>

      <form id="inviteDevForm">
        <div class="row g-3">
          <!-- Developer Email -->
          <div class="col-md-6">
            <!-- ✅ FIX: Added for="invite-email" to link with the email input field -->
            <label for="invite-email" class="form-label small text-secondary fw-semibold">Developer Email</label>
            <input type="email" id="invite-email" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="dev@studio.com" required>
          </div>

          <!-- Role Selection -->
          <div class="col-md-4">
            <!-- ✅ FIX: Added for="invite-role" to link with the select menu element -->
            <label for="invite-role" class="form-label small text-secondary fw-semibold">Role / Access Level</label>
            <!-- Repopulated on load from /assignable-roles with only what THIS
                 caller may assign: an inviter may assign roles strictly below
                 their own, so an admin is never offered Superuser. These
                 options are just a fallback if that request fails. -->
            <select id="invite-role" class="form-select form-select-sm bg-dark text-light border-secondary">
              <option value="developer" selected>Developer</option>
              <option value="user">Tester</option>
            </select>
          </div>

          <!-- Submit Button -->
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" id="btn-send-invite" class="btn btn-primary btn-sm w-100 fw-semibold">
              <i class="bi bi-send me-1"></i> Send Invite
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Active & Pending Invitations Table -->
  <div class="card bg-dark text-light border-secondary shadow-sm">
    <div class="card-header bg-black border-secondary py-3 d-flex justify-content-between align-items-center">
      <h6 class="card-title mb-0 fw-bold">Active & Pending Invitations</h6>
      <span class="small text-secondary">Default Expiration: <strong>28 Days</strong></span>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-hover mb-0 align-middle small">
        <thead class="table-secondary text-uppercase">
          <tr>
            <th>Developer</th>
            <th>Role</th>
            <th>Status</th>
            <th>Expires</th>
            <th>Reissues</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="invite-list-body">
          <!-- Dynamic rows injected by JavaScript -->
          <tr>
            <td colspan="6" class="text-center text-muted py-3">Loading invitations...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
