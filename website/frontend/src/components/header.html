
<!-- frontend/src/components/header.html -->
<header class="app-header">
  <div class="header-brand">
    <!-- The script will replace this text based on the user's role -->
    <h1 id="headerDashboardTitle">⚡ Dashboard</h1>
  </div>

  <div class="header-user-actions" id="headerUserActions">
    <div class="user-info">
      <span class="status-dot online"></span>
      <span id="currentUserLabel">Logged in as: <strong id="headerUsernameTarget">Loading...</strong></span>
    </div>

    <!-- The manual is NOT here. It was a button in this corner, beside Log out,
         which is where a session action lives and a link to a document does
         not. It is now a small glyph in the bottom-left corner, added by
         frontend/src/manualLink.js. -->

    <button id="logoutBtn" class="btn btn-outline-light btn-sm">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>
</header>
